services:
  - type: web
    name: project-aether
    runtime: python
    plan: free
    # The second command pre-warms chromadb's bundled default embedding
    # model (all-MiniLM-L6-v2 ONNX, ~79MB) into its on-disk cache. Without
    # this, the first live query downloads+loads it cold inside the
    # request handler on the 512MB runtime instance, which raced against
    # the rest of the app's memory footprint and OOM-killed the process.
    buildCommand: pip install -r requirements.txt && python -c "from chromadb.utils.embedding_functions import DefaultEmbeddingFunction; DefaultEmbeddingFunction()(['warmup'])"
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pinned to match what CI actually verifies this requirements.txt
      # against. Render defaults to the latest Python (3.14 as of this
      # writing), which lacks prebuilt wheels for a pandas version this
      # dependency chain needs, forcing a from-source build that fails
      # to compile at all on that toolchain.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        value: d229b721-6e42-4d8a-800d-54f2d56651a6
      - key: CHROMA_DATABASE
        value: RAGabaoun
      - key: CHROMA_COLLECTION
        value: project_aether_docs
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: LOG_LEVEL
        value: INFO
