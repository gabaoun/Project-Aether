<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Aether — Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f17;
    --card-bg: rgba(19, 26, 42, 0.75);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(99, 102, 241, 0.4);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --cache-color: #10b981;
    --cache-bg: rgba(16, 185, 129, 0.1);
    --code-bg: #1e293b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    background-image: 
      radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .logo-icon svg {
    width: 16px;
    height: 16px;
    fill: white;
  }

  .nav-links {
    display: flex;
    gap: 12px;
  }

  .nav-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    transition: color 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .nav-link:hover {
    color: var(--accent);
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  form {
    display: flex;
    gap: 10px;
  }

  .input-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }

  input[type=text] {
    width: 100%;
    background: rgba(15, 23, 42, 0.6);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
    background: rgba(15, 23, 42, 0.9);
  }

  button.btn-send {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  button.btn-send:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px var(--accent-glow);
  }

  button.btn-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .example-btn {
    background: rgba(30, 41, 59, 0.5);
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .example-btn:hover {
    color: var(--text);
    border-color: var(--border-hover);
    background: rgba(99, 102, 241, 0.1);
  }

  #status {
    min-height: 20px;
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .cache-badge {
    background: var(--cache-bg);
    color: var(--cache-color);
    border: 1px solid rgba(16, 185, 129, 0.2);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .answer-card {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: none;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .answer-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .btn-copy {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn-copy:hover {
    color: var(--text);
    border-color: var(--muted);
  }

  .answer-body {
    line-height: 1.65;
    font-size: 0.95rem;
    color: var(--text);
  }

  .answer-body p { margin: 0 0 10px; }
  .answer-body p:last-child { margin-bottom: 0; }
  .answer-body ul, .answer-body ol { margin: 8px 0; padding-left: 20px; }
  .answer-body li { margin-bottom: 4px; }
  .answer-body code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Fira Code', monospace;
    font-size: 0.85em;
  }

  .sources-wrapper {
    margin-top: 16px;
    display: none;
  }

  .sources-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .source-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .source-chip {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Fira Code', monospace;
    font-size: 0.78rem;
    padding: 3px 8px;
    border-radius: 6px;
  }

  footer {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="header-top">
      <div class="logo-badge">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        Project Aether
      </div>
      <div class="nav-links">
        <a class="nav-link" href="https://github.com/gabaoun/Project-Aether" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
        <a class="nav-link" href="/docs" target="_blank">API Docs</a>
      </div>
    </div>
    <p>Event-driven RAG engine interactive live demo. Ask questions about Gabriel Penha's background, architecture decisions, or tech stack.</p>
  </header>

  <div class="card">
    <form id="form">
      <div class="input-wrapper">
        <input id="input" type="text" placeholder="Ask about Gabriel's experience, AI projects, C++..." autocomplete="off" maxlength="300" required>
      </div>
      <button id="send" class="btn-send" type="submit">Ask</button>
    </form>

    <div class="examples">
      <button type="button" class="example-btn" data-q="What C++ experience does Gabriel have?">⚡ C++ experience?</button>
      <button type="button" class="example-btn" data-q="What AI and RAG projects has Gabriel built?">🚀 AI/RAG projects?</button>
      <button type="button" class="example-btn" data-q="What is Gabriel's education background?">🎓 Education?</button>
    </div>

    <div id="status"></div>

    <div id="answerCard" class="answer-card">
      <div class="answer-header">
        <span class="answer-title">Answer</span>
        <button id="copyBtn" class="btn-copy" type="button">Copy</button>
      </div>
      <div id="answerBody" class="answer-body"></div>
      
      <div id="sourcesWrapper" class="sources-wrapper">
        <div class="sources-title">Sources</div>
        <div id="sourceChips" class="source-chips"></div>
      </div>
    </div>
  </div>

  <footer>
    Project Aether &bull; High-Performance Event-Driven RAG Engine
  </footer>
</main>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const answerCard = document.getElementById('answerCard');
  const answerBody = document.getElementById('answerBody');
  const sourcesWrapper = document.getElementById('sourcesWrapper');
  const sourceChips = document.getElementById('sourceChips');
  const copyBtn = document.getElementById('copyBtn');

  document.querySelectorAll('.example-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.q;
      form.requestSubmit();
    });
  });

  function parseMarkdown(text) {
    if (!text) return '';
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    
    // Bold
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Inline Code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    
    // Lists & paragraphs
    const lines = html.split('\n');
    let inList = false;
    let result = '';

    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith('- ') || /^\d+\.\s/.test(trimmed)) {
        if (!inList) {
          result += '<ul>';
          inList = true;
        }
        const itemContent = trimmed.replace(/^(-\s*|\d+\.\s*)/, '');
        result += `<li>${itemContent}</li>`;
      } else {
        if (inList) {
          result += '</ul>';
          inList = false;
        }
        if (trimmed.length > 0) {
          result += `<p>${line}</p>`;
        }
      }
    });

    if (inList) result += '</ul>';
    return result;
  }

  copyBtn.addEventListener('click', () => {
    const rawText = answerBody.innerText;
    navigator.clipboard.writeText(rawText).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    sendBtn.disabled = true;
    answerCard.style.display = 'none';
    sourcesWrapper.style.display = 'none';
    statusEl.innerHTML = '<span class="spinner"></span> Thinking... (first request after idle may take ~30s to wake server)';

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query }),
      });
      const data = await res.json();

      if (!res.ok) {
        statusEl.innerHTML = `<span style="color: #ef4444">Error: ${data.detail || res.status}</span>`;
        return;
      }

      if (data.from_cache) {
        statusEl.innerHTML = '<span class="cache-badge">⚡ Cached</span> Answer retrieved from semantic cache';
      } else {
        statusEl.innerHTML = '<span style="color: var(--accent); font-weight: 600;">✨ Generated</span> Answer processed live';
      }

      answerBody.innerHTML = parseMarkdown(data.answer);
      answerCard.style.display = 'block';

      if (data.source_nodes && data.source_nodes.length) {
        sourceChips.innerHTML = '';
        data.source_nodes.forEach(src => {
          const chip = document.createElement('span');
          chip.className = 'source-chip';
          chip.textContent = src;
          sourceChips.appendChild(chip);
        });
        sourcesWrapper.style.display = 'block';
      }
    } catch (err) {
      statusEl.innerHTML = '<span style="color: #ef4444">Could not reach the API. Server may be waking up - please retry shortly.</span>';
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
